<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22386b"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc8ff"/>
      <stop offset="1" stop-color="#3d7be0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e9f5"/>
      <stop offset="1" stop-color="#8d99b3"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(.94) translate(-256 -256)">
    <!-- карточка тренировки сзади -->
    <g transform="rotate(-8 256 190)">
      <rect x="140" y="52" width="232" height="240" rx="18" fill="#fff" opacity=".4" transform="rotate(-7 256 172)"/>
      <rect x="140" y="52" width="232" height="240" rx="18" fill="#fff"/>
      <rect x="162" y="76" width="86" height="14" rx="7" fill="#1b2438"/>
      <rect x="162" y="98" width="54" height="9" rx="4.5" fill="#c6cfdf"/>
      <circle cx="342" cy="88" r="17" fill="#34c77b"/>
      <path d="M333 88 l7 7 l12 -14" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#dbe7ff">
        <rect x="162" y="128" width="60" height="30" rx="10"/>
        <rect x="230" y="128" width="60" height="30" rx="10"/>
        <rect x="298" y="128" width="52" height="30" rx="10"/>
        <rect x="162" y="168" width="60" height="30" rx="10"/>
        <rect x="230" y="168" width="60" height="30" rx="10"/>
      </g>
      <g fill="#3d7be0">
        <rect x="173" y="139" width="38" height="8" rx="4"/>
        <rect x="241" y="139" width="38" height="8" rx="4"/>
        <rect x="309" y="139" width="30" height="8" rx="4"/>
        <rect x="173" y="179" width="38" height="8" rx="4"/>
        <rect x="241" y="179" width="38" height="8" rx="4"/>
      </g>
      <rect x="162" y="222" width="188" height="12" rx="6" fill="#e5ebf7"/>
      <rect x="162" y="222" width="128" height="12" rx="6" fill="#34c77b"/>
    </g>
    <!-- крупная гантель -->
    <g transform="translate(256 330) rotate(-28)" filter="url(#sh)">
      <rect x="-190" y="-17" width="380" height="34" rx="11" fill="url(#bar)"/>
      <rect x="-190" y="-30" width="22" height="60" rx="8" fill="url(#bar)"/>
      <rect x="168" y="-30" width="22" height="60" rx="8" fill="url(#bar)"/>
      <!-- левые блины -->
      <rect x="-160" y="-92" width="52" height="184" rx="18" fill="url(#plate)"/>
      <rect x="-104" y="-66" width="36" height="132" rx="13" fill="url(#plate)"/>
      <!-- правые блины -->
      <rect x="108" y="-92" width="52" height="184" rx="18" fill="url(#plate)"/>
      <rect x="68" y="-66" width="36" height="132" rx="13" fill="url(#plate)"/>
      <g fill="#fff" fill-opacity=".38">
        <rect x="-150" y="-82" width="12" height="164" rx="6"/>
        <rect x="118" y="-82" width="12" height="164" rx="6"/>
      </g>
    </g>
  </g>
</svg>

# Cloudflare Pages — статический трекер тренировок
# Деплой:  npx wrangler pages deploy
# (первый запуск сам создаст проект "gym-hero" → https://gym-hero.pages.dev)
name = "gym-hero"
pages_build_output_dir = "public"
compatibility_date = "2025-09-04"

# Общая база всех сервисов; таблицы сервиса с префиксом gym_hero_. Биндинг доступен как env.DB.
[[d1_databases]]
binding = "DB"
database_name = "looneyhome_database"
database_id = "9ba3a6cf-95b2-40b1-a20e-8c9ab0cb1e95"
migrations_dir = "migrations"

# Проверка ключей — сервис auth-kit (Worker, entrypoint Vault). Rate-limit неудачных попыток живёт там же.
[[services]]
binding = "VAULT"
service = "auth-kit"
entrypoint = "Vault"
